# see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Publish Package to npmjs

on:
  push:
    tags:
      - 'v*.*.*'
  # 手动触发（Trusted Publishing 首次配置、或 tag 流水线失败后重试时使用）
  workflow_dispatch:
  # release:
  #   types: [created]

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: 'recursive'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.com

      - uses: pnpm/action-setup@v6
        id: pnpm-install
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts=false

      - name: Build
        run: npm run build

      - name: Publish (npm Trusted Publishing / OIDC)
        run: |
          # 走 npm Trusted Publishing：由 GitHub Actions 的 OIDC 换取临时发布凭证，
          # 因此必须清掉 setup-node 写入的占位 _authToken，否则会带着失效 token 去请求并报 404
          npm config delete "//registry.npmjs.org/:_authToken" || true
          npm publish --provenance
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # - name: Github Release
      #   uses: softprops/action-gh-release@v2
