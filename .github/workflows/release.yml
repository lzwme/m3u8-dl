name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.10.0'
  push:
    tags:
      - v*.*.*

concurrency:
  # 同一 tag 上的发布操作串行化，避免并发写草稿互相冲突
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GITHUB_CI: 1
  USE_HARD_LINKS: false

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          # tag 推送时构建并发布该 tag 对应的代码；workflow_dispatch 则基于 main
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          submodules: 'recursive'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.com

      - uses: pnpm/action-setup@v6
        id: pnpm-install
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store

      # electron-builder 每次会下载对应平台的 Electron(~120MB) 与打包工具链，
      # macOS 一次要打包 x64/arm64 两个架构，重复下载非常耗时；这里按 OS 缓存其下载目录
      - name: Cache electron & electron-builder downloads (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('packages/m3u8dl-app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Cache electron & electron-builder downloads (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('packages/m3u8dl-app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Cache electron & electron-builder downloads (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LOCALAPPDATA }}/electron/Cache
            ${{ env.LOCALAPPDATA }}/electron-builder/Cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('packages/m3u8dl-app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts=false

      # 打包时会在 dist/app-build-tmp 下重新 npm install（含 ffmpeg-static 大体积二进制），
      # 缓存该目录的 node_modules 以避免每次全量重新下载
      - name: Cache app-build dependencies
        uses: actions/cache@v6
        with:
          path: packages/m3u8dl-app/dist/app-build-tmp/node_modules
          key: ${{ runner.os }}-app-deps-${{ hashFiles('package.json', 'packages/m3u8dl-app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-app-deps-

      - name: Get release tag
        id: get-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # 制品名与 latest*.yml 中的版本取自根包 package.json，发布 tag 必须与之一致，
      # 否则会发布版本错位的产物，这里在构建前尽早拦截
      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag" != "v${pkg_version}" ]; then
            echo "::error::Git tag ${tag} does not match package.json version v${pkg_version}."
            exit 1
          fi
          echo "OK: tag=${tag} matches version v${pkg_version}"

      - name: Build cjs
        run: npm run build

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd packages/m3u8dl-app
          pnpm install --no-frozen-lockfile --ignore-scripts=false
          npm run build -- --linux
        env:
          # RENDERER_VITE_AIHUBMIX_SECRET: ${{ vars.RENDERER_VITE_AIHUBMIX_SECRET }}
          NODE_OPTIONS: --max-old-space-size=12288

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: |
          cd packages/m3u8dl-app
          pnpm install --no-frozen-lockfile --ignore-scripts=false
          npm run build -- --mac
        env:
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ vars.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ vars.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NODE_OPTIONS: --max-old-space-size=12288

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          cd packages/m3u8dl-app
          pnpm install --no-frozen-lockfile --ignore-scripts=false
          npm run build -- --win
        env:
          # GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=12288

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          makeLatest: false
          tag: ${{ steps.get-tag.outputs.tag }}
          artifacts: 'packages/m3u8dl-app/dist/app/*.exe,packages/m3u8dl-app/dist/app/*.zip,packages/m3u8dl-app/dist/app/*.7z,packages/m3u8dl-app/dist/app/*.dmg,packages/m3u8dl-app/dist/app/*.AppImage,packages/m3u8dl-app/dist/app/*.snap,packages/m3u8dl-app/dist/app/*.deb,packages/m3u8dl-app/dist/app/*.rpm,packages/m3u8dl-app/dist/app/*.tar.gz,packages/m3u8dl-app/dist/app/latest*.yml,packages/m3u8dl-app/dist/app/rc*.yml,packages/m3u8dl-app/dist/app/*.blockmap'
          # artifacts: 'packages/m3u8dl-app/dist/app/*.{exe,zip,dmg,AppImage,deb,rpm,tar.gz,snap,yml,tar.gz,blockmap},packages/m3u8dl-app/dist/app/{latest,rc}*.yml'
          token: ${{ secrets.GITHUB_TOKEN }}
